# Celeste goal chapter requirements
# Each goal area (7a, 7b, 7c, 9a, 9b, 9c, 10a, 10b) has checkpoints.
# A checkpoint has:
#   item: the item name that unlocks this checkpoint (null for start entry)
#   rooms: list of rooms, each room is a list of possible routes
#     requires: items needed for this route
#     unless: (optional) items that block this route
#     if_keysanity: (optional) route only available when keysanity is on
#     is_dts: (optional) route uses a Dash Trigger Skip

"7c":
  checkpoints:
    - item:
      rooms:
        - room_name: All rooms
          routes:
            - requires: [Dash Refills, Badeline Boosters, Springs, Pink Clouds]
